name: Backend Deploy

# Two named Cloudflare environments (staging/production - see
# backend/wrangler.toml.example), same split as the Flutter app's env/staging.json
# vs env/prod.json. Staging redeploys on every push to main AND on every PR
# that touches backend/** (so a migration/deploy problem surfaces on the PR
# itself, against the real Cloudflare account, instead of only after
# merging - see the incident that motivated this: PR #1 merged clean in CI
# because --local migrations can't catch a bug that only exists in D1's
# --remote path). Production only deploys on a published release, keeping
# the backend's version in lockstep with the app's.
#
# Needs four repo secrets once a Cloudflare account exists (see
# backend/README.md): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# D1_STAGING_DATABASE_ID, D1_PRODUCTION_DATABASE_ID. The D1_* secrets are
# templated into wrangler.toml below rather than committed - see
# backend/wrangler.toml.example's comment for why. Safe to expose to the
# pull_request trigger below since this repo has no external/fork
# contributors - GitHub withholds secrets from pull_request runs
# triggered by forks regardless.
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-deploy.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-deploy.yml']
  release:
    types: [published]

concurrency:
  group: backend-deploy-${{ github.event_name == 'release' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/backend-test.yml

  deploy-staging:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: backend-staging
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Get dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate wrangler.toml
        run: |
          sed \
            -e "s/REPLACE_WITH_STAGING_D1_DATABASE_ID/${{ secrets.D1_STAGING_DATABASE_ID }}/" \
            -e "s/REPLACE_WITH_PRODUCTION_D1_DATABASE_ID/${{ secrets.D1_PRODUCTION_DATABASE_ID }}/" \
            wrangler.toml.example > wrangler.toml

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: d1 migrations apply DB --env staging --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy --env staging

  deploy-production:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: backend-production
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Get dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate wrangler.toml
        run: |
          sed \
            -e "s/REPLACE_WITH_STAGING_D1_DATABASE_ID/${{ secrets.D1_STAGING_DATABASE_ID }}/" \
            -e "s/REPLACE_WITH_PRODUCTION_D1_DATABASE_ID/${{ secrets.D1_PRODUCTION_DATABASE_ID }}/" \
            wrangler.toml.example > wrangler.toml

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: d1 migrations apply DB --env production --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy --env production
