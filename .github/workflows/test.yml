name: Test

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Run analysis
        run: flutter analyze --no-fatal-infos

      - name: Generate app icons
        uses: ./.github/actions/generate-app-icons
        with:
          platform: android

      - name: Run Android unit tests
        run: |
          flutter build apk --debug --target-platform android-arm64
          cd android && ./gradlew :app:jacocoTestReport

      - name: Upload Android coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-android
          path: build/app/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          if-no-files-found: ignore

  codecov:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-unit
          path: coverage-unit

      - name: Download Android coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-android
          path: coverage-android

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage-unit/lcov.info,coverage-android/jacocoTestReport.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
