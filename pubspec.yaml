name: frawly
description: "Freezer Log: a Flutter app for tracking frozen meal-prep containers with Supabase storage."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  supabase_flutter: ^2.5.6
  # >=13.0.0: 8.x's Android AAR is compiled against API 34, which conflicts
  # with flutter_plugin_android_lifecycle's compileSdk>=36 requirement
  # (AAR metadata check failure) once compileSdk climbs that high - see the
  # generate-app-icons/CI Android build fix in this same change.
  file_picker: ^13.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.png"
    # Must match web/manifest.json's background_color/theme_color -
    # flutter_launcher_icons overwrites those fields on every run, so a
    # mismatch here silently clobbers the PWA's brand color.
    background_color: "#0079C2"
    theme_color: "#0079C2"
