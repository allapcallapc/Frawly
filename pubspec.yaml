name: frawly
description: "Frawly: a Flutter app for tracking frozen meal-prep containers, talking to a custom backend over HTTP."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  http: ^1.2.2
  # Stores the connected backend's URL + passphrase - see
  # lib/services/backend_connection.dart.
  flutter_secure_storage: ^11.2.0
  # >=13.0.0: 8.x's Android AAR is compiled against API 34, which conflicts
  # with flutter_plugin_android_lifecycle's compileSdk>=36 requirement
  # (AAR metadata check failure) once compileSdk climbs that high - see the
  # generate-app-icons/CI Android build fix in this same change.
  file_picker: ^13.1.0
  cupertino_icons: ^1.0.8
  # Reads the installed app version - see lib/services/update_service.dart.
  # (Newer than SplitBalance's ^5.0.1 - that version's `web` constraint
  # conflicts with file_picker's here.)
  package_info_plus: ^10.2.1
  # Locates a cache dir to download the update APK into - see
  # lib/services/update_service.dart.
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  # Lets tests swap in an in-memory FlutterSecureStoragePlatform instead of
  # hitting a real platform channel - see test/services/backend_connection_test.dart.
  flutter_secure_storage_platform_interface: ^2.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.png"
    # Must match web/manifest.json's background_color/theme_color -
    # flutter_launcher_icons overwrites those fields on every run, so a
    # mismatch here silently clobbers the PWA's brand color.
    background_color: "#314A8A"
    theme_color: "#314A8A"
