# Skips the 'integration' tag by default so a plain `flutter test` (and the
# fast job in .github/workflows/test.yml) stays hermetic and doesn't need
# Docker/a local Supabase stack. The integration-test CI job runs those
# explicitly via `flutter test --tags integration --run-skipped` once
# SUPABASE_TEST_URL/SUPABASE_TEST_SERVICE_ROLE_KEY are set - see
# test/integration/*.dart.
tags:
  integration:
    skip: "requires a local Supabase stack (supabase start)"
